<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F4F6F6;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #1C2833;
  padding: 30pt 40pt;
  margin: 0;
}
h1 {
  color: #ffffff;
  font-size: 36pt;
  font-weight: bold;
  margin: 0;
}
.content {
  margin: 40pt;
  flex: 1;
  display: flex;
  gap: 30pt;
}
.structure-box {
  background: #ffffff;
  padding: 30pt;
  border-radius: 4pt;
  flex: 1;
}
.code {
  font-family: 'Courier New', monospace;
  color: #1C2833;
  font-size: 14pt;
  line-height: 1.8;
  margin: 0;
}
.description {
  background: #027DFD;
  color: #ffffff;
  padding: 25pt;
  border-radius: 4pt;
  flex: 1;
}
p {
  font-size: 15pt;
  line-height: 1.7;
  margin: 0 0 12pt 0;
}
p:last-child {
  margin-bottom: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>코드 구조</h1>
</div>
<div class="content">
  <div class="structure-box">
    <p class="code">lib/</p>
    <p class="code">├── main.dart</p>
    <p class="code">├── pages/</p>
    <p class="code">│   └── login_page.dart</p>
    <p class="code">└── enums.dart</p>
  </div>
  <div class="description">
    <p><b>main.dart</b> - 앱 진입점, MaterialApp 설정, 라우팅</p>
    <p><b>pages/</b> - 페이지 위젯</p>
    <p><b>enums.dart</b> - 공통 열거형 정의</p>
  </div>
</div>
</body>
</html>
