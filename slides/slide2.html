<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F4F6F6;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #1C2833;
  padding: 30pt 40pt;
  margin: 0;
}
h1 {
  color: #ffffff;
  font-size: 36pt;
  font-weight: bold;
  margin: 0;
}
.content {
  margin: 40pt;
  flex: 1;
}
.overview-box {
  background: #ffffff;
  padding: 30pt;
  border-left: 8pt solid #027DFD;
  border-radius: 4pt;
}
p {
  color: #1C2833;
  font-size: 18pt;
  line-height: 1.6;
  margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>프로젝트 개요</h1>
</div>
<div class="content">
  <div class="overview-box">
    <p>Flutter 기반의 크로스플랫폼 애플리케이션입니다.</p>
    <p style="margin-top: 15pt;">로그인 기능이 포함된 기본 앱 구조를 가지고 있습니다.</p>
  </div>
</div>
</body>
</html>
