<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F4F6F6;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #1C2833;
  padding: 30pt 40pt;
  margin: 0;
}
h1 {
  color: #ffffff;
  font-size: 36pt;
  font-weight: bold;
  margin: 0;
}
.content {
  margin: 40pt;
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}
.sdk-box {
  background: #ffffff;
  padding: 40pt 50pt;
  border-radius: 8pt;
  border: 3pt solid #027DFD;
  text-align: center;
}
.sdk-item {
  color: #1C2833;
  font-size: 22pt;
  margin: 0 0 20pt 0;
}
.sdk-item:last-child {
  margin-bottom: 0;
}
.version {
  color: #027DFD;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="header">
  <h1>SDK 버전</h1>
</div>
<div class="content">
  <div class="sdk-box">
    <p class="sdk-item">Dart SDK: <span class="version">^3.8.1</span></p>
    <p class="sdk-item">flutter_lints: <span class="version">^5.0.0</span></p>
  </div>
</div>
</body>
</html>
